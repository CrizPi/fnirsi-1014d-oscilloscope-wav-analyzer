services:
  - type: web
    name: fnirsi-1014d-oscilloscope-wav-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app
    envVars:
      - key: FNIRSI_APP_MODE
        value: server
      - key: FNIRSI_SERVER_HOST
        value: 0.0.0.0
      - key: MPLBACKEND
        value: Agg
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: FNIRSI_APP_DATA_DIR
        value: /tmp/fnirsi-1014d-analyzer
